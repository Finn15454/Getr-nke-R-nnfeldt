<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Getränke Rönnfeldt</title><meta name="claude:viewport-fit-sides" content="cover"><style id="app-css">
@import url("https://fonts.googleapis.com/css2?family=Bitter:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap");

/* Layout: schmales Logo oben, Inhalt je Reiter (Angebote, Getränke, Filialen, Mehr), Reiterleiste unten, Warenkorb-Leiste darüber. Farben aus dem Rönnfeldt-Logo. */
:root {
  --bg: #F3F7FA;
  --card: #FFFFFF;
  --ink: #1B2A38;
  --muted: #566878;
  --line: #DCE5EC;
  --green: #2E8563;
  --blue: #2C67B1;
  --blue-soft: #E6EFF9;
  --on-blue: #FFFFFF;
  --on-green: #FFFFFF;
  --yellow: #F5E03A;
  --on-yellow: #1B2A38;
  --red: #B3382C;
  --sale: #C62828;
  --on-sale: #FFFFFF;
  --font-display: "Bitter", Georgia, serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A24;
    --card: #152433;
    --ink: #E8F0F6;
    --muted: #9DB0C0;
    --line: #243749;
    --green: #5FC49F;
    --blue: #7FB2EE;
    --blue-soft: #1B3350;
    --on-blue: #0E1A24;
    --on-green: #0E1A24;
    --red: #F08A7E;
    --sale: #FF8A80;
    --on-sale: #2A0B08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A24;
  --card: #152433;
  --ink: #E8F0F6;
  --muted: #9DB0C0;
  --line: #243749;
  --green: #5FC49F;
  --blue: #7FB2EE;
  --blue-soft: #1B3350;
  --on-blue: #0E1A24;
  --on-green: #0E1A24;
  --red: #F08A7E;
  --sale: #FF8A80;
  --on-sale: #2A0B08;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--card);
  z-index: 10;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Verwaltungsleiste */
.adminbar { background: var(--yellow); color: var(--on-yellow); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.bar p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 14px; font-weight: 700; }
.bar-btns { display: flex; gap: 8px; }

/* Kopf */
.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 10px; }
.logo { background: #FFFFFF; border-radius: 12px; padding: 6px 12px; display: flex; justify-content: center; }
.logo img { display: block; width: 100%; max-width: 250px; height: auto; }

.search {
  width: 100%;
  height: 46px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  padding: 0 14px;
}
.search::placeholder { color: var(--muted); }

.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 4px; display: grid; gap: 4px; }
.chips { display: flex; gap: 8px; padding-block: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  height: 38px;
  padding: 0 16px;
  border: 0;
  border-radius: 19px;
  background: var(--blue-soft);
  color: var(--blue);
  font-weight: 700;
  font-size: 15px;
}
.chip.on { background: var(--blue); color: var(--on-blue); }

.notice { background: var(--blue-soft); color: var(--blue); font-size: 14px; font-weight: 700; border-radius: 10px; padding: 9px 12px; margin-top: 12px; }

main.wrap { padding-block: 4px 170px; }
h2.t { margin: 18px 0 4px; font-family: var(--font-display); font-size: 24px; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); }

/* Getränkekarte */
.grp { margin-top: 22px; }
.grp h2 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); }
.card { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.card > li + li { border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 16px; }
.open { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; margin: 0; padding: 0; border: 0; background: none; text-align: left; }
.thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 58%; height: 58%; opacity: 0.7; }
.thumb.big { width: 88px; height: 88px; border-radius: 12px; }
.r-main { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.r-name { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
.r-meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.side { display: grid; justify-items: end; gap: 6px; }
.r-price { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-edit { font-size: 12px; font-weight: 600; color: var(--muted); }
.off .r-name, .off .r-meta, .off .r-price, .off .thumb { opacity: 0.5; }
.r-out { margin-top: 3px; padding: 2px 9px; border-radius: 6px; background: var(--yellow); color: var(--on-yellow); font-size: 12px; font-weight: 800; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { padding: 1px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.tag.knaller { background: var(--yellow); color: var(--on-yellow); box-shadow: 0 0 0 1px var(--sale); }
.tag.werbung { background: var(--blue-soft); color: var(--blue); }
.tag.neu { background: var(--green); color: var(--on-green); }
.tag.regional { background: var(--line); color: var(--ink); }
.hqhead { margin: 28px 0 0; font-family: var(--font-display); font-size: 20px; }
.add { width: 40px; height: 40px; border: 0; border-radius: 20px; background: var(--green); color: var(--on-green); font-size: 24px; font-weight: 700; line-height: 1; }
.step { display: inline-flex; align-items: center; height: 40px; border-radius: 20px; background: var(--blue-soft); }
.step button { width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: var(--blue); font-size: 22px; font-weight: 700; }
.step output { min-width: 22px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Angebote */
.filters { display: grid; gap: 4px; }
.sel { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.offers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.offer { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.offer.k { border: 2px solid var(--sale); }
.o-img { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.o-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.o-img svg { width: 22%; height: 22%; opacity: 0.6; }
.badge { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 7px; background: var(--sale); color: var(--on-sale); font-weight: 800; font-size: 11px; letter-spacing: 0.04em; }
.badge.k { background: var(--yellow); color: var(--on-yellow); box-shadow: 0 0 0 2px var(--sale); }
.badge.ex { top: auto; bottom: 8px; left: auto; right: 8px; background: var(--ink); color: var(--bg); letter-spacing: 0; }
.o-body { display: grid; gap: 4px; padding: 10px; flex: 1; align-content: start; }
.o-name { font-size: 15px; line-height: 1.25; font-weight: 800; overflow-wrap: anywhere; }
.o-size { color: var(--muted); font-size: 12px; }
.o-prices { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.o-price { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; color: var(--sale); font-variant-numeric: tabular-nums; }
.o-old { color: var(--muted); text-decoration: line-through; font-size: 13px; font-variant-numeric: tabular-nums; }
.o-save { align-self: start; padding: 2px 7px; border-radius: 6px; background: var(--green); color: var(--on-green); font-weight: 800; font-size: 12px; }
.o-note { color: var(--muted); font-size: 12px; }
.o-foot { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px 10px; min-height: 40px; }
.o-foot .btn { flex: 1; padding: 0 6px; font-size: 14px; min-height: 42px; }
@media (min-width: 540px) {
  .offers { gap: 14px; }
  .badge { top: 10px; left: 10px; padding: 5px 11px; font-size: 13px; }
  .o-body { gap: 6px; padding: 14px; }
  .o-name { font-size: 18px; }
  .o-size { font-size: 14px; }
  .o-price { font-size: 30px; }
  .o-old { font-size: 16px; }
  .o-note { font-size: 13px; }
  .o-foot { padding: 0 14px 14px; }
}
.pstat { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
.pstat b { font-size: 16px; }
.pstat p { margin: 0; color: var(--muted); font-size: 14px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.empty { margin-top: 40px; text-align: center; color: var(--muted); }
.empty h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 20px; color: var(--ink); text-transform: none; letter-spacing: 0; }
.empty p { margin: 0; }

/* Filialen und Mehr */
.stores { display: grid; gap: 12px; margin-top: 14px; }
.store, .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; min-width: 0; }
.store h3, .box h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.store p, .box p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.store .ph, .box .ph { color: var(--ink); font-weight: 700; user-select: all; }
.home-tag { justify-self: start; padding: 2px 10px; border-radius: 6px; background: var(--green); color: var(--on-green); font-size: 12px; font-weight: 800; }
.boxes { display: grid; gap: 12px; margin-top: 14px; }
.box ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.lnk { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--blue); color: var(--blue); font-weight: 700; text-decoration: none; font-size: 14px; }

.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 36px; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 800; font-size: 15px; text-decoration: none; text-align: center; }
.btn[disabled] { opacity: 0.6; cursor: default; }
.btn.wide { width: 100%; }
.btn.primary { background: var(--blue); color: var(--on-blue); }
.btn.green { background: var(--green); color: var(--on-green); }
.btn.dark { background: var(--on-yellow); color: #FFFFFF; }
.btn.ghost-dark { background: transparent; color: var(--on-yellow); border-color: var(--on-yellow); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.outline { background: var(--card); color: var(--red); border-color: var(--line); font-weight: 700; }
.btn.line { background: var(--card); color: var(--blue); border-color: var(--blue); }
.btn.danger { background: transparent; color: var(--red); border-color: var(--red); }

.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; height: 54px; padding: 0 26px; border: 0; border-radius: 27px; background: var(--green); color: var(--on-green); font-size: 17px; font-weight: 800; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); white-space: nowrap; }

/* Reiterleiste */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 60px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--blue); }
.tab.on span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }

/* Warenkorb-Leiste */
.cartbar { position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 16; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.cartbar button { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 688px; height: 54px; margin: 0 auto; padding: 0 18px; border: 0; border-radius: 14px; background: var(--blue); color: var(--on-blue); font-weight: 800; font-size: 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }
.cb-r { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }

/* Fenster */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 20, 30, 0.6); }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 18px 18px 0 0; }
.sheet.tall { height: 92%; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.x { flex: none; width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--blue-soft); color: var(--blue); font-size: 18px; }
.sheet-body { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--card); }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 800; color: var(--muted); }
.fld input:not([type=file]), .fld textarea { width: 100%; min-width: 0; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.fld textarea { height: 120px; padding: 10px 14px; resize: none; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.chips-in { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-in .chip { height: 34px; font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
.switch span { flex: 1; min-width: 0; display: grid; gap: 2px; }
.switch small { color: var(--muted); font-size: 13px; }
.switch input { width: 24px; height: 24px; accent-color: var(--green); flex: none; }
.err { margin: 0; color: var(--red); font-weight: 700; font-size: 14px; }
.photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo-btns { display: grid; gap: 8px; min-width: 0; flex: 1; }
.filein { max-width: 100%; min-width: 0; font-size: 14px; color: var(--muted); }
.filein::file-selector-button { min-height: 44px; margin-right: 10px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--blue); background: var(--card); color: var(--blue); font: inherit; font-weight: 800; cursor: pointer; }
.photo-msg { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }
.photo-msg.err { color: var(--red); font-weight: 700; }

.hero { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; max-height: 260px; border-radius: 14px; overflow: hidden; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero svg { width: 22%; height: 22%; opacity: 0.6; }
.d-price { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--blue); font-variant-numeric: tabular-nums; }
.d-meta { margin: 0; color: var(--muted); }
.d-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.clist { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.clist > li + li { border-top: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
.c-main { display: grid; gap: 2px; min-width: 0; }
.c-side { display: grid; justify-items: end; gap: 6px; }
.c-sum { font-family: var(--font-display); font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; }
.sum { margin: 0; display: grid; gap: 6px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.sum dt, .sum dd { margin: 0; }
.sum .total { font-weight: 800; font-size: 18px; padding-top: 8px; border-top: 1px solid var(--line); }
.col-btns { display: grid; gap: 10px; }

.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.prow .thumb { width: 48px; height: 48px; }
.prow .r-meta b { color: var(--sale); }
.pick { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pick .thumb { width: 48px; height: 48px; }

.dialog { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 32px)); max-height: 90%; overflow-y: auto; background: var(--card); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.dialog h3 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.dialog p { margin: 0; color: var(--muted); }
.dialog input { height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.dialog-btns { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up 0.22s ease-out; }

  function openDraft(i) {

    if (!name) msg = 'Bitte gib dem Getränk einen Namen.';

    else if (!(price >= 0)) msg = 'Bitte gib den Preis als Zahl ein, zum Beispiel 1,29.';
    else if (!(deposit >= 0)) msg = 'Bitte gib das Pfand als Zahl ein, zum Beispiel 0,08.';
    if (msg) { showErr('f-err', msg); return; }
    var entry = { id: d.id || uid(), name: name, category: category, size: d.size.trim(), price: price, deposit: deposit, available: d.available, image: d.image || '', tags: (d.tags || []).slice() };
    if (d.id) state.items = state.items.map(function (i) { return i.id === d.id ? entry : i; }); else state.items.push(entry);

    else if (!(price >= 0)) msg = 'Bitte gib den Angebotspreis als Zahl ein, zum Beispiel 9,99.';
    else if (!(old >= 0)) msg = 'Bitte gib den alten Preis als Zahl ein oder lass das Feld leer.';
    else if (old > 0 && old <= price) msg = 'Der alte Preis muss höher sein als der Angebotspreis. Sonst lass ihn leer.';
    else if (!(dep >= 0)) msg = 'Bitte gib das Pfand als Zahl ein oder lass das Feld leer.';
    if (msg) { showErr('o-err', msg); return; }
    var entry = { id: o.id || uid(), name: name, size: o.size.trim(), category: o.category.trim(), image: o.image || '', price: price, oldPrice: old, pfand: !!o.pfand, deposit: dep, knaller: !!o.knaller, stock: !!o.stock, stores: o.stores.slice() };
    if (o.isNew) pd.offers.push(entry); else pd.offers[o.idx] = entry;
    od = null; ov.pop(); renderOverlay();
  }
  function applyProspekt() {
    var p = pd;
    if (p.from && p.until && p.until < p.from) { showErr('p-err', 'Das Ende muss nach dem Beginn liegen.'); return; }
    state.prospekt = { title: p.title.trim(), from: p.from, until: p.until, offers: p.offers };
    dirty = true;
    var miss = !p.from || !p.until ? ' Kunden sehen es erst, wenn Gültig von und bis eingetragen sind.' : '';
    closeAll(); renderAll();
    toast('Prospekt übernommen. Tippe oben auf „Sichern“, damit es gespeichert wird.' + miss);
  }

  function setPhotoMsg(m, isErr) {
    photoMsg = m; photoErr = !!isErr;
    var el = document.querySelector('.photo-msg');
    if (el) { el.textContent = m; el.className = 'photo-msg' + (isErr ? ' err' : ''); }
  }
  function shrink(src, w, h) {
    var k = Math.min(1, 520 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    var x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.78);
  }
  function processPhoto(file, target) {
    if (!file) return;
    var fail = function () { var m = 'Dieses Foto konnte nicht gelesen werden. Versuche ein JPG oder PNG.'; setPhotoMsg(m, true); toast(m); };
    var done = function (data) { if (target === 'od') od.image = data; else draft.image = data; setPhotoMsg('Foto übernommen.'); renderOverlay(); };
    setPhotoMsg('Foto wird verarbeitet …');
    var viaReader = function () {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () { try { done(shrink(img, img.naturalWidth, img.naturalHeight)); } catch (e) { fail(); } };
        img.onerror = fail; img.src = fr.result;
      };
      fr.onerror = fail; fr.readAsDataURL(file);
    };
    var viaUrl = function () {
      var url; try { url = URL.createObjectURL(file); } catch (e) { viaReader(); return; }
      var img = new Image();
      img.onload = function () { try { var d = shrink(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); done(d); } catch (e) { URL.revokeObjectURL(url); viaReader(); } };
      img.onerror = function () { URL.revokeObjectURL(url); viaReader(); };
      img.src = url;
    };
    if (window.createImageBitmap) {
      createImageBitmap(file).then(function (bm) {
        try { var d = shrink(bm, bm.width, bm.height); if (bm.close) bm.close(); done(d); } catch (e) { viaUrl(); }
      }, viaUrl);
    } else viaUrl();
  }

  /* ---------- Sichern ---------- */
  function buildDoc() {
    var resetEl = document.head.querySelector('style'), reset = resetEl ? resetEl.textContent : FALLBACK_RESET;
    var css = document.getElementById('app-css').textContent, js = document.getElementById('app-js').textContent;
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>' + TITLE + '</title><meta name="claude:viewport-fit-sides" content="cover"><style id="app-css">' + css + '</style><div id="app"></div>' +
      '<script type="application/json" id="menu-data">' + json + '<\/script><script id="app-js">' + js + '<\/script></body></html>';
  }
  function persist() {
    if (busy) return;
    if (STANDALONE) {
      try {
        localStorage.setItem('rf-state', JSON.stringify(state));
        saved = JSON.stringify(state); dirty = false; renderBar(); toast('Auf diesem Gerät gespeichert.');
      } catch (e) { toast('Speichern nicht möglich. Vielleicht sind die Fotos zu groß oder zu viele.'); }
      return;
    }
    busy = true; renderBar();
    var use = window.claude && window.claude.use;
    Promise.resolve(use ? window.claude.use('artifact') : null).then(function (artifact) {
      if (!artifact) throw { code: 'unavailable' };
      try { sessionStorage.setItem('rf-admin', '1'); } catch (e) {}
      return artifact.publish(buildDoc());
    }).then(function () {
      saved = JSON.stringify(state); dirty = false; busy = false; renderBar(); toast('Gesichert. Kunden sehen die Änderungen jetzt.');
    }).catch(function (err) {
      busy = false; renderBar();
      var code = err && err.code, msg = 'Sichern hat nicht geklappt. Bitte versuche es noch einmal.';
      if (/^(not_writer|not_granted|consent_required|unavailable|not_declared|capability_disabled)$/.test(code)) msg = 'Sichern geht nur für den Besitzer dieser Seite. Öffne den Link mit deinem Claude-Konto.';
      else if (code === 'conflict') msg = 'Die Karte wurde zwischenzeitlich geändert. Die Seite lädt neu.';
      else if (code === 'rate_limited') msg = 'Zu viele Speichervorgänge. Bitte warte kurz.';
      else if (code === 'too_large') msg = 'Zu groß zum Speichern. Verwende weniger oder kleinere Fotos.';
      toast(msg);
    });
  }

  /* ---------- Bedienung ---------- */
  document.addEventListener('input', function (e) {
    var el = e.target; if (!el) return;
    if (el.id === 'q') { query = el.value; renderDrinkList(); return; }
    var d = el.dataset || {};
    if (d.f && draft) draft[d.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (d.o && od) od[d.o] = el.type === 'checkbox' ? el.checked : el.value;
    if (d.p && pd) pd[d.p] = el.value;
    if (d.c) { if (d.c === 'name') cartName = el.value; else cartNote = el.value; var wa = document.getElementById('wa-link'); if (wa) wa.href = waUrl(); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el) return;
    if (el.id === 'f-store') { storeFilter = el.value; renderView(); return; }
    if (el.id === 'f-photo' && draft) { processPhoto(el.files && el.files[0], 'draft'); return; }
    if (el.id === 'o-photo' && od) { processPhoto(el.files && el.files[0], 'od'); return; }
    var d = el.dataset || {};
    if (el.type === 'checkbox') { if (d.f && draft) draft[d.f] = el.checked; if (d.o && od) od[d.o] = el.checked; }
    if (d.p && pd) pd[d.p] = el.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'pin') submitPin();
    if (e.key === 'Escape' && ov.length) closeOv();
  });

  function submitPin() {
    var el = document.getElementById('pin');
    if (el && el.value === PIN) {
      admin = true; ov = []; pinError = false;
      try { sessionStorage.setItem('rf-admin', '1'); } catch (e) {}
      renderOverlay(); renderAll();
    } else { pinError = true; renderOverlay('pin'); }
  }
  function saveSettings() {
    var raw = (document.getElementById('set-wa').value || '').replace(/[^\d]/g, '');
    if (raw.indexOf('00') === 0) raw = raw.slice(2); else if (raw.charAt(0) === '0') raw = '49' + raw.slice(1);
    if (raw && raw.length < 8) { settingsError = 'Bitte gib eine gültige Nummer ein.'; renderOverlay('set-wa'); return; }
    state.whatsapp = raw; settingsError = ''; dirty = true; closeAll(); renderAll();
  }
  function copyOrder() {
    var text = orderText();
    var fail = function () { cartFallback = true; renderOverlay(); var ta = document.getElementById('order-text'); if (ta) { ta.focus(); ta.select(); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Bestellliste kopiert.'); }, fail); else fail();
  }
  function cartChanged() { renderView(); renderCartBar(); var top = ov[ov.length - 1]; if (top && (top.t === 'detail' || top.t === 'cart')) renderOverlay(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.dataset.act, id = t.dataset.id, n = t.dataset.n;

    if (act === 'tab') { tab = t.dataset.tab; armed = null; renderTabs(); renderView(); window.scrollTo(0, 0); }
    else if (act === 'cat') { activeCat = t.dataset.cat; renderDrinkChips(); renderDrinkList(); }
    else if (act === 'ocat') { offerCat = t.dataset.cat; renderView(); }
    else if (act === 'home') { homeStore = homeStore === id ? '' : id; storeFilter = homeStore; try { localStorage.setItem('rf-home', homeStore); } catch (e2) {} renderView(); toast(homeStore ? 'Gemerkt. Bei den Angeboten ist diese Filiale vorausgewählt.' : 'Filiale nicht mehr gemerkt.'); }
    else if (act === 'inc') { setQty(id, qty(id) + 1); cartChanged(); }
    else if (act === 'dec') { setQty(id, qty(id) - 1); cartChanged(); }
    else if (act === 'detail') openOv({ t: 'detail', id: id });
    else if (act === 'cart-open') { ov = []; cartFallback = false; openOv({ t: 'cart' }); }
    else if (act === 'cart-copy') copyOrder();
    else if (act === 'cart-clear') { if (arm('cartclear', renderOverlay)) { cart = {}; try { localStorage.setItem('rf-cart', '{}'); } catch (e3) {} closeAll(); renderView(); renderCartBar(); } }
    else if (act === 'close') closeOv();
    else if (act === 'pin-open') { pinError = false; openOv({ t: 'pin' }, 'pin'); }
    else if (act === 'pin-submit') submitPin();
    else if (act === 'settings-open') { settingsError = ''; openOv({ t: 'settings' }, 'set-wa'); }
    else if (act === 'settings-save') saveSettings();
    else if (act === 'edit') { var it = byId(id); if (it) openDraft(it); }
    else if (act === 'new') openDraft(null);
    else if (act === 'photo-clear') { if (od && ov[ov.length - 1].t === 'offer') od.image = ''; else if (draft) draft.image = ''; renderOverlay(); }
    else if (act === 'editor-cat') { draft.category = t.dataset.cat; renderOverlay(); }
    else if (act === 'tag') { var tk = t.dataset.tag, ix = draft.tags.indexOf(tk); if (ix >= 0) draft.tags.splice(ix, 1); else draft.tags.push(tk); renderOverlay(); }
    else if (act === 'editor-save') applyDraft();
    else if (act === 'editor-delete') { if (arm('del', renderOverlay)) { var did = draft.id; state.items = state.items.filter(function (i) { return i.id !== did; }); closeAll(); commit(); } }
    else if (act === 'clear-all') { if (arm('clear', renderDrinkList)) { state.items = []; state.isExample = false; commit(); } }
    else if (act === 'reset-seed') { if (arm('seed', renderDrinkList)) { state.items = (state.seedItems || state.items).map(function (i) { return Object.assign({}, i); }); state.isExample = true; dirty = true; renderAll(); } }
    /* Prospekt */
    else if (act === 'pros-edit') openProspekt();
    else if (act === 'pros-example') { state.prospekt = exampleProspekt(); dirty = true; renderAll(); toast('Beispiel-Prospekt geladen. Die Preise sind Platzhalter.'); }
    else if (act === 'pros-preview-saved') openOv({ t: 'preview', p: state.prospekt });
    else if (act === 'pros-preview') openOv({ t: 'preview', p: pd });
    else if (act === 'pros-save') applyProspekt();
    else if (act === 'pros-delete') { if (arm('pdel', renderOverlay)) { state.prospekt = { title: '', from: '', until: '', offers: [] }; dirty = true; closeAll(); renderAll(); } }
    else if (act === 'offer-add') { pickMode = 'prospekt'; openOv({ t: 'pick' }); }
    else if (act === 'pick') {
      var src = byId(id); ov.pop();
      startOffer({ isNew: true, id: null, name: src.name, size: src.size || '', category: src.category, image: src.image || '', price: '', oldPrice: numStr(src.price), pfand: src.deposit > 0, deposit: src.deposit ? numStr(src.deposit) : '', knaller: (src.tags || []).indexOf('knaller') >= 0, stock: false, stores: [] });
    }
    else if (act === 'pick-own') { ov.pop(); startOffer({ isNew: true, id: null, name: '', size: '', category: '', image: '', price: '', oldPrice: '', pfand: true, deposit: '', knaller: false, stock: false, stores: [] }); }
    else if (act === 'offer-edit') {
      var o = pd.offers[+n];
      startOffer({ isNew: false, idx: +n, id: o.id, name: o.name, size: o.size || '', category: o.category || '', image: o.image || '', price: numStr(o.price), oldPrice: o.oldPrice ? numStr(o.oldPrice) : '', pfand: !!o.pfand, deposit: o.deposit ? numStr(o.deposit) : '', knaller: !!o.knaller, stock: !!o.stock, stores: (o.stores || []).slice() });
    }
    else if (act === 'o-cat') { od.category = t.dataset.cat; renderOverlay(); }
    else if (act === 'o-store') { var k = od.stores.indexOf(id); if (k >= 0) od.stores.splice(k, 1); else od.stores.push(id); renderOverlay(); }
    else if (act === 'offer-save') applyOffer();
    else if (act === 'offer-delete') { if (arm('odel', renderOverlay)) { pd.offers.splice(od.idx, 1); od = null; ov.pop(); renderOverlay(); } }
    else if (act === 'save-all') persist();
    else if (act === 'admin-end') {
      if (!dirty || arm('end', renderBar)) {
        if (dirty) { try { var s0 = JSON.parse(saved); state.items = s0.items; state.isExample = s0.isExample; state.whatsapp = s0.whatsapp || ''; state.prospekt = s0.prospekt || state.prospekt; } catch (e4) {} }
        dirty = false; admin = false; armed = null;
        try { sessionStorage.removeItem('rf-admin'); } catch (e5) {}
        renderAll();
      }
    }
  });

  renderAll();
})();
</script></body></html>
